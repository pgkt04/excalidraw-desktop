name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the built artifacts'
        required: true
        default: true
        type: boolean

env:
  NODE_VERSION: '22.12.0'

jobs:
  build-bundle:
    name: Excalidraw app bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build pinned excalidraw-app
        run: node scripts/build-excalidraw.js

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: app-bundle
          path: app-bundle
          include-hidden-files: true
          if-no-files-found: error

  build-mac:
    name: macOS (arm64)
    runs-on: macos-latest
    needs: build-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download bundle
        uses: actions/download-artifact@v5
        with:
          name: app-bundle
          path: app-bundle

      - name: Build
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mac-arm64
          path: |
            dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    needs: build-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download bundle
        uses: actions/download-artifact@v5
        with:
          name: app-bundle
          path: app-bundle

      - name: Build
        run: npx electron-builder --win --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    needs: build-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download bundle
        uses: actions/download-artifact@v5
        with:
          name: app-bundle
          path: app-bundle

      - name: Build
        run: npx electron-builder --linux --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Create Release
    if: inputs.create_release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Excalidraw Desktop v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
